name: Daily Taiwan Chips Update

on:
  schedule:
    # 台灣時間週一至週五 16:00（UTC 08:00）自動執行
    - cron: '0 8 * * 1-5'
  workflow_dispatch: # 支援在 GitHub 網頁手動按按鈕執行

permissions:
  contents: write

jobs:
  update-chips:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests pandas

      - name: Fetch daily TWSE & TAIFEX chips
        run: python fetch_daily_chips.py

      - name: Commit and push updated chips_history.csv
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add chips_history.csv
          git diff --staged --quiet || git commit -m "chore: update daily chips_history.csv"
          git push
